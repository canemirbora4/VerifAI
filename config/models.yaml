# VerifAI Model Registry
# =========================
# This file defines available models and their configurations.
# Models can be loaded from HuggingFace Hub or local paths.

# ============================================================================
# FUSION DETECTOR (DEFAULT - RECOMMENDED)
# ============================================================================
# The Fusion detector combines CLIP semantic features with frequency-domain
# analysis for the best accuracy (97.0%). This is the default detector.

fusion_detector:
  name: "Fusion Detector (CLIP + Frequency)"
  description: |
    Combines CLIP ViT-L/14 semantic features with frequency-domain analysis.
    Best accuracy (97.0%), catches edge cases that CLIP alone might miss.
    Tested on Defactify (SD3, SDXL, DALL-E 3, MidJourney) + COCO_AI (SD, FLUX, Ideogram).
  components:
    clip:
      model: "openai/clip-vit-large-patch14"
      head_weights: "models/modern_ai_detector.pt"
      weight: 0.80
    frequency:
      model: "models/frequency_classifier.joblib"
      weight: 0.20
  accuracy: "97.0%"  # Average across Defactify + COCO_AI datasets
  real_accuracy: "94.8%"
  fake_accuracy: "99.2%"
  benchmarks:
    defactify: "98.5%"
    coco_ai: "95.5%"
  recommended: true
  default: true

# ============================================================================
# NEURAL DETECTOR MODELS (LEGACY)
# ============================================================================
# These models are kept for backward compatibility but FusionDetector is recommended.

neural_detectors:
  # Vision Transformer (ViT) - Default
  vit_base:
    name: "ViT Base (Patch 16, 224)"
    hf_model_id: "google/vit-base-patch16-224"
    architecture: "vit"
    input_size: [224, 224]
    patch_size: 16
    num_params: "86M"
    description: "Base Vision Transformer, good balance of speed and accuracy"
    default: true
    
  vit_large:
    name: "ViT Large (Patch 16, 224)"
    hf_model_id: "google/vit-large-patch16-224"
    architecture: "vit"
    input_size: [224, 224]
    patch_size: 16
    num_params: "304M"
    description: "Larger ViT for higher accuracy, slower inference"
    default: false

  # ConvNeXt - CNN alternative
  convnext_base:
    name: "ConvNeXt Base"
    hf_model_id: "facebook/convnext-base-224"
    architecture: "convnext"
    input_size: [224, 224]
    num_params: "89M"
    description: "Modern CNN architecture, efficient and accurate"
    default: false
    
  convnext_tiny:
    name: "ConvNeXt Tiny"
    hf_model_id: "facebook/convnext-tiny-224"
    architecture: "convnext"
    input_size: [224, 224]
    num_params: "29M"
    description: "Lightweight CNN, fast inference"
    default: false

  # EfficientNet - Mobile/edge deployment
  efficientnet_b0:
    name: "EfficientNet B0"
    hf_model_id: "google/efficientnet-b0"
    architecture: "efficientnet"
    input_size: [224, 224]
    num_params: "5M"
    description: "Smallest EfficientNet, best for edge deployment"
    default: false

  # Swin Transformer - Hierarchical ViT
  swin_base:
    name: "Swin Transformer Base"
    hf_model_id: "microsoft/swin-base-patch4-window7-224"
    architecture: "swin"
    input_size: [224, 224]
    patch_size: 4
    window_size: 7
    num_params: "88M"
    description: "Hierarchical transformer with shifted windows"
    default: false

# ============================================================================
# CLIP-based Detectors (RECOMMENDED)
# ============================================================================
# CLIP models provide better cross-generator generalization because they are
# trained on 400M+ diverse internet images. The backbone is frozen, only the
# classification head is trained.

clip_detectors:
  # RECOMMENDED: Best cross-generator performance
  clip_vit_large:
    name: "CLIP ViT-L/14 (Recommended)"
    hf_model_id: "openai/clip-vit-large-patch14"
    architecture: "clip"
    input_size: [224, 224]
    embedding_dim: 768
    num_params: "428M"
    trainable_params: "~400K"  # Only classification head
    description: |
      CLIP ViT-L/14 with frozen backbone + trainable MLP head.
      Best choice for cross-generator generalization.
      Distribution-aware, doesn't overfit to specific generator fingerprints.
    head_config:
      hidden_dims: [512, 256]
      dropout: 0.3
    recommended: true
    default: true
    
  clip_vit_base:
    name: "CLIP ViT-B/32 (Faster)"
    hf_model_id: "openai/clip-vit-base-patch32"
    architecture: "clip"
    input_size: [224, 224]
    embedding_dim: 512
    num_params: "151M"
    trainable_params: "~300K"
    description: "Smaller CLIP model, faster inference but slightly lower accuracy"
    head_config:
      hidden_dims: [256, 128]
      dropout: 0.3
    recommended: false
    default: false

# Feature Extractors (for embeddings/anomaly detection)
feature_extractors:
  clip_vit_base:
    name: "CLIP ViT Base"
    hf_model_id: "openai/clip-vit-base-patch32"
    architecture: "clip"
    embedding_dim: 512
    description: "CLIP vision encoder for robust embeddings"
    
  dinov2_base:
    name: "DINOv2 Base"
    hf_model_id: "facebook/dinov2-base"
    architecture: "dinov2"
    embedding_dim: 768
    description: "Self-supervised vision features, excellent for anomaly detection"

# Pre-trained AI Detection Models (Ready to use!)
ai_detection_models:
  # RECOMMENDED: General AI detection
  umm_maybe_ai_detector:
    name: "AI Image Detector (umm-maybe)"
    hf_model_id: "umm-maybe/AI-image-detector"
    architecture: "vit"
    input_size: [224, 224]
    num_params: "86M"
    description: "General-purpose AI vs Real detector. Best for most use cases."
    labels: {0: "artificial", 1: "human"}
    recommended: true
    available: true
    
  # SPECIALIZED: Stable Diffusion XL detection
  organika_sdxl_detector:
    name: "SDXL Detector (Organika)"
    hf_model_id: "Organika/sdxl-detector"
    architecture: "swin"
    input_size: [224, 224]
    num_params: "87M"
    description: "Specialized for Stable Diffusion XL images. May have false positives on real photos."
    labels: {0: "artificial", 1: "human"}
    recommended: false
    available: true
    
  # Custom fine-tuned model (placeholder)
  verifai_v1:
    name: "VerifAI v1 (Custom)"
    local_path: "checkpoints/verifai_v1.safetensors"
    base_model: "vit_base"
    description: "Custom fine-tuned model for AI detection"
    available: false  # Set to true when trained

# Model Selection Rules
selection:
  # Priority order for model selection
  priority:
    - "clip_vit_large"          # CLIP ViT-L/14 (BEST cross-generator performance)
    - "verifai_v1"              # Custom fine-tuned model if available
    - "umm_maybe_ai_detector"   # Pre-trained AI detector (fallback)
    - "vit_base"                # Default fallback (needs fine-tuning)
  
  # Default model for AI detection
  default_ai_detector: "openai/clip-vit-large-patch14"  # CLIP recommended
  default_legacy_detector: "umm-maybe/AI-image-detector"  # Legacy option
  
  # Device-specific recommendations
  device_recommendations:
    cpu:
      recommended: "clip_vit_base"
      reason: "Smaller CLIP, works well on CPU"
    cuda:
      recommended: "clip_vit_large"
      reason: "Full CLIP ViT-L/14, best accuracy on GPU"
    mps:
      recommended: "clip_vit_large"
      reason: "CLIP ViT-L/14, optimized for Apple Silicon"

# Training Configuration
training:
  # CLIP Head Training (RECOMMENDED)
  clip_head:
    # Only train the classification head, CLIP backbone is frozen
    backbone: "openai/clip-vit-large-patch14"
    freeze_backbone: true
    head_hidden_dims: [512, 256]
    head_dropout: 0.3
    # Training params
    learning_rate: 1.0e-3  # Higher LR since only head is trained
    weight_decay: 1.0e-4
    max_epochs: 10
    batch_size: 32
    # Data augmentation
    augmentation:
      random_crop: true
      random_flip: true
      color_jitter: 0.1
      jpeg_compression: [70, 100]  # Augment with JPEG artifacts
    # Checkpointing
    save_best: true
    checkpoint_dir: "checkpoints/clip_head"
  
  # Legacy ViT fine-tuning (full model)
  legacy_vit:
    base_model: "vit_base"
    learning_rate: 1.0e-4
    weight_decay: 0.01
    warmup_steps: 500
    max_epochs: 10
    patience: 3
    gradient_accumulation: 4
    fp16: true
